services:
  api:
    build: .
    container_name: keenetic-monitor-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./raw-responses:/app/raw-responses:Z
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  timescaledb:
    image: docker.io/timescale/timescaledb:latest-pg16
    container_name: keenetic-monitor-timescaledb
    environment:
      POSTGRES_DB: keenetic_monitor
      POSTGRES_USER: keenetic
      POSTGRES_PASSWORD: keenetic
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./app/db/migrations:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keenetic -d keenetic_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    container_name: keenetic-monitor-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescaledb-data:
  grafana-data:
